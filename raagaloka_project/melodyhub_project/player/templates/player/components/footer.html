{# footer.html - left: current song image | centre: previous / play-pause / next | right: sound control #}
<footer class="footer" id="footer" aria-label="Player controls">
  <div class="f-now">
    <img id="f-img" src="" alt="" width="56" height="56">
    <div class="f-meta">
      <strong id="f-title">-</strong>
      <span id="f-artist">-</span>
    </div>
  </div>

  <div class="f-center">
    <div class="controls">
      <button type="button" class="ctrl" id="btn-prev" aria-label="Previous song" title="Previous">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
      </button>
      <button type="button" class="ctrl ctrl-main" id="btn-play" aria-label="Play" title="Play / Pause">
        <svg class="i-play" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button type="button" class="ctrl" id="btn-next" aria-label="Next song" title="Next">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg>
      </button>
    </div>
    <div class="progress">
      <span class="time" id="t-cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="Seek">
      <span class="time" id="t-dur">0:00</span>
    </div>
  </div>

  <div class="f-volume">
    <button type="button" class="icon-btn" id="btn-mute" aria-label="Mute" title="Mute"></button>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
  </div>
</footer>
