<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Agent</title>
</head>

        <button type="submit">Add Agent</button>
    </form>

</body>
</html>
