{% extends 'contacts/base.html' %}
{% block title %}Delete Contact | Contact Book 2.0{% endblock %}
{% block content %}
<div class="confirm-card">
  <div class="warning-icon">!</div><h1 class="page-title">Delete contact?</h1>
  <p class="text-secondary">Are you sure you want to permanently delete <strong>{{ contact.full_name }}</strong>? This action cannot be undone.</p>
  <form method="post">{% csrf_token %}<div class="d-flex gap-2 justify-content-center mt-4"><button class="btn btn-danger btn-lg" type="submit">Yes, delete</button><a class="btn btn-light btn-lg" href="{% url 'contact_detail' contact.pk %}">Cancel</a></div></form>
</div>
{% endblock %}
