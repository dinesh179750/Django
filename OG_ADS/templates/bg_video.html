{% load static %}
<style>
    .bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2;
    }
    .bg-video-veil {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.336);
        z-index: -1;
    }
</style>

<video class="bg-video" autoplay muted loop playsinline>
    <source src="{% static video %}" type="video/mp4">
</video>
<div class="bg-video-veil"></div>
