{% load static %}{# navbar.html - logo | home | favourite songs | search bar | login #}
<header class="navbar" id="navbar">
  <a class="brand" href="#home" data-nav="home" aria-label="Raagaloka home">
    <img src="{% static 'images/logo.svg' %}" alt="" width="40" height="40">
    <span>Raagaloka</span>
  </a>

  <button class="icon-btn menu-toggle" id="menu-toggle" type="button"
          aria-expanded="false" aria-controls="nav-links" aria-label="Open menu">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

  <nav class="nav-links" id="nav-links" aria-label="Main">
    <a href="#home" data-nav="home">Home</a>
    <a href="#favourites" data-nav="favourites">Favourite Songs</a>
  </nav>

  <div class="search" id="search-box" role="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="search-input" placeholder="Search songs, singers, movies..."
           autocomplete="off" aria-label="Search songs" aria-controls="search-results">
    <ul class="search-results" id="search-results" hidden></ul>
  </div>

  <button class="btn btn-login" id="login-btn" type="button">Login</button>
</header>

{# simple login pop-up (front-end demo) #}
<div class="modal" id="login-modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <form class="modal-card" id="login-form" role="dialog" aria-modal="true" aria-labelledby="login-title" novalidate>
    <h2 id="login-title">Welcome back</h2>
    <p class="muted">Log in to Raagaloka</p>
    <label for="login-user">Username</label>
    <input id="login-user" name="username" type="text" autocomplete="username" required minlength="2" placeholder="e.g. alex">
    <label for="login-pass">Password</label>
    <input id="login-pass" name="password" type="password" autocomplete="current-password" required placeholder="Any password (demo)">
    <p class="form-error" id="login-error" role="alert" hidden></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-close>Cancel</button>
      <button type="submit" class="btn">Login</button>
    </div>
  </form>
</div>
